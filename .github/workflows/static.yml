# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment. Cancel any queued/in-progress run when a newer push arrives —
# for a static-content deploy, the latest commit is always what should be live, and queueing causes
# pile-ups when environment protection rules hold a run in pending state.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, so the IndexNow step can diff this push against the last one.
          fetch-depth: 0
      - name: Check page rules
        # Stops the deploy if a page is missing a standing component (see CLAUDE.md, "Page rules")
        run: python3 scripts/check-pages.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow
        # Tells Bing and the other IndexNow engines which sitemap pages this push
        # changed, so they recrawl within hours. ChatGPT search leans on Bing's
        # index. A manual "Run workflow" has no previous commit, so it submits the
        # whole sitemap. A failed ping must never fail a deploy that already went
        # live, hence continue-on-error.
        continue-on-error: true
        run: python3 scripts/indexnow.py --base-url https://wholesomegirlies.xyz/ --before "${{ github.event.before }}" --after "${{ github.sha }}"
